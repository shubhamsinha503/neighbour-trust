# Scheduled data ingestion.
#
# This replaces the long-lived APScheduler process (agents/scheduler.py) when
# deploying somewhere without an always-on worker. Both paths call the same job
# modules, so a run here does exactly what a local `make fetch` does — including
# writing to ingest_run, which is what /healthz reads to tell whether ingestion
# is alive.
#
# Why Actions rather than a hosted worker: the agents are short bursts of I/O on
# a fixed cadence, which is precisely the shape cron was made for. A container
# idling 23 hours a day to run 3.5 minutes of work is the wrong unit to pay for,
# and the run logs end up in the repo where you would look for them anyway.
#
# Cadences match agents/scheduler.py — see the comments there for why each is
# offset off the hour.

name: Ingest

on:
  schedule:
    # Hourly at :17. CPCB publishes near the hour and every naive scraper hits
    # :00; the offset is politeness as much as reliability.
    - cron: "17 * * * *"
    # Sundays 03:47 UTC — schools. No longer an Overpass query: UDISE plus
    # OpenStreetMap read from the same downloaded extracts the connectivity run
    # uses, so this now downloads and parses them too.
    - cron: "47 3 * * 0"
    # Sundays 05:13 UTC — connectivity. Reads OpenStreetMap from downloaded
    # extracts rather than Overpass, but still the longest job here (~10 min of
    # download and parsing), so it stays well clear of the schools pass rather
    # than queued behind it: two long jobs sharing the concurrency group would
    # push one into the next hour's air quality run.
    - cron: "13 5 * * 0"
    # Daily 04:23 UTC — news, after Indian morning editions are indexed.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      agent:
        description: "Which agent to run"
        required: true
        default: air_quality
        type: choice
        options: [air_quality, schools, news_monitor, connectivity, all]
      reclassify:
        description: >-
          Re-judge every stored headline (news_monitor only). Needed after a
          classifier change: judged mentions are never revisited, so a prompt
          fix leaves the verdicts it was written to correct in place. Costs a
          full classification pass — leave off for routine runs.
        required: false
        default: false
        type: boolean

concurrency:
  # A slow run must never overlap the next one — the agents upsert, so an
  # overlap is not corrupting, but it doubles upstream API spend against rate
  # limits that are already the binding constraint.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Measured on the 2026-09-09 `all` run, which this was too tight for:
    #
    #   air quality    ~2 min
    #   schools        27.8 min   (downloads ~780 MB and parses both extracts)
    #   connectivity   13 sec     (reads what schools already parsed)
    #   news monitor   cancelled at 15.3 min, mid-run
    #
    # Schools carries the whole OpenStreetMap cost now, and connectivity gets
    # its answer for nothing — which is the intended trade and why the pair is
    # far cheaper together than the ~20 minutes they used to cost apart. But it
    # front-loads 28 minutes before news starts, and 45 left news short.
    #
    # The scheduled crons each run one agent and fit comfortably; this ceiling
    # is for the manual `all` run. Minutes are free on a public repository, so
    # the only thing a generous limit costs is a later failure signal.
    timeout-minutes: 90

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      # Free-tier fallback for the headline classifier. The classifier is the
      # only per-item cost here, and exhausting it stops the news pipeline dead
      # — which it did, leaving 802 headlines unjudged and every safety card
      # reading "0% assessed". With this set, a spent Anthropic budget slows the
      # work instead of halting it.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Paid fallback for when the free tier's 8,000 tokens a minute runs out.
      # About a dollar a month at current volumes.
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Which providers to try and in what order; blank means groq,deepseek.
      # An unset repository variable arrives as an empty string rather than as
      # absent, so every reader of these uses `or` and not a dict default.
      CLASSIFIER_PROVIDER: ${{ vars.CLASSIFIER_PROVIDER }}
      CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL }}
      # Optional. Unset means the classifier's own default (claude-opus-5).
      # Worth setting deliberately: a full first pass is ~800 headlines, which
      # is a few dollars on Opus and a fraction of that on Haiku, and short
      # headline classification is a task Haiku handles well.
      NEWS_CLASSIFIER_MODEL: ${{ secrets.NEWS_CLASSIFIER_MODEL }}
      # GDELT has been unreachable from every network tried since 2026-09-01.
      # Each attempt costs a 30s timeout and a run makes 22 of them, so it is
      # off unless explicitly switched back on.
      ENABLE_GDELT: ${{ vars.ENABLE_GDELT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Decide which agent this run is for
        id: which
        run: |
          # A scheduled run knows only its own cron expression, so map it back
          # to the agent it was scheduled for.
          case "${{ github.event.schedule }}" in
            "17 * * * *")  echo "agent=air_quality"  >> "$GITHUB_OUTPUT" ;;
            "47 3 * * 0")  echo "agent=schools"      >> "$GITHUB_OUTPUT" ;;
            "13 5 * * 0")  echo "agent=connectivity" >> "$GITHUB_OUTPUT" ;;
            "23 4 * * *")  echo "agent=news_monitor" >> "$GITHUB_OUTPUT" ;;
            *)             echo "agent=${{ inputs.agent || 'air_quality' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Apply migrations
        # Idempotent, and cheap. Running it every time means a schema change
        # ships with the commit that needs it rather than as a remembered step.
        run: python -m infra.migrate

      - name: Seed localities
        run: python -m agents.common.seed_localities

      - name: Run air quality
        if: steps.which.outputs.agent == 'air_quality' || steps.which.outputs.agent == 'all'
        run: python -m agents.air_quality.run

      - name: Run schools
        # UDISE for staffing, OpenStreetMap for what is actually there. The OSM
        # half now reads the same Geofabrik extracts as the connectivity run
        # rather than querying Overpass, so this step downloads ~780 MB and
        # parses it — several minutes before any school is written.
        #
        # Within a single run the parse is shared: agents/common/osm_features
        # caches the parsed features, so `agent=all` pays for it once. Across
        # separately scheduled runs it does not carry over, which is why these
        # two crons each pay their own parse. Worth revisiting if the weekly
        # minutes ever matter.
        if: steps.which.outputs.agent == 'schools' || steps.which.outputs.agent == 'all'
        run: python -m agents.schools.run

      - name: Run connectivity
        # Downloads two OpenStreetMap extracts (~780 MB total) and reads them
        # locally: roughly three minutes of transfer plus six of parsing, after
        # which all 44 localities are answered from memory.
        #
        # Deliberately not cached between runs. The extracts are rebuilt daily
        # and this job runs weekly, so a restored cache would always be stale
        # enough to re-download anyway — the cache would cost a restore and save
        # nothing.
        #
        # This replaced the Overpass API, which took 20s-4min per locality and
        # never completed a pass; partial runs used to be the normal outcome.
        # They are no longer expected, so a failure here is worth reading.
        if: steps.which.outputs.agent == 'connectivity' || steps.which.outputs.agent == 'all'
        run: python -m agents.infrastructure.run

      - name: Check the classifier
        # Only for news runs, and never fatal. It names *why* a classifier is
        # unusable — a rejected key, a decommissioned model and a spent quota all
        # surface as "could not answer a test headline", and the fix differs for
        # each. Three seconds here saves reading a fifteen-minute run to learn
        # the same thing less precisely.
        if: steps.which.outputs.agent == 'news_monitor' || steps.which.outputs.agent == 'all'
        continue-on-error: true
        run: python -m scripts.check_classifier

      - name: Run news monitor
        if: steps.which.outputs.agent == 'news_monitor' || steps.which.outputs.agent == 'all'
        # `inputs.reclassify == true` rather than a bare truthiness check.
        # GitHub expressions treat any non-empty string as true, and a boolean
        # input does not always arrive as a boolean — from a schedule or the API
        # it can be the string "false", which would silently enable a flag that
        # queues several thousand paid re-judgements. The explicit comparison is
        # false for "false", for null, and for an absent input.
        run: |
          python -m agents.news_monitor.run             ${{ inputs.reclassify == true && '--reclassify' || '' }}

      - name: Report ingestion health
        # Always runs, so a failed agent still leaves a readable summary rather
        # than only a red cross.
        if: always()
        run: |
          python - <<'PY'
          import os
          from agents.common import db
          with db.connect() as conn:
              for category in ("air_quality", "schools", "crime"):
                  row = db.last_productive_ingest(conn, category=category)
                  if row:
                      print(f"{category}: last stored {row['localities_ok']} localities "
                            f"at {row['finished_at']}")
                  else:
                      print(f"{category}: no productive run on record")
          PY
